name: Release

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints/ci.txt -e ".[dev]"

      - name: Require zero-error release typing
        run: python tools/typecheck.py --scope release

      - name: Install release dependencies
        run: python -m pip install -c constraints/ci.txt build python-semantic-release

      - name: Build smoke
        run: python -m build --wheel --outdir /tmp/vamos-release-smoke

      - name: Run Semantic Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          semantic-release version

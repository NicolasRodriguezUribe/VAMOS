name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  build-n-publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # IMPORTANT: this permission is mandatory for trusted publishing

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install canonical typing environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints/ci.txt -e ".[dev]"

      - name: Require zero-error release typing
        run: python tools/typecheck.py --scope release

      - name: Install build dependencies
        run: python -m pip install -c constraints/ci.txt build

      - name: Build distribution
        run: python -m build

      - name: Install wheel and smoke test
        run: |
          python -m pip install dist/*.whl
          python - <<'PY'
          import vamos
          import vamos.api

          print("Wheel smoke OK:", vamos.__version__)
          PY

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # Note: This uses Trusted Publishing by default if configured on PyPI.
        # Alternatively, use user/password secrets:
        # with:
        #   user: __token__
        #   password: ${{ secrets.PYPI_API_TOKEN }}

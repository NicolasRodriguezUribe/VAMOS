name: Performance Checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "0 3 * * *"

jobs:
  performance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints/ci.txt -e ".[dev,compute,research]"

      - name: Benchmark smoke
        run: |
          python tools/benchmark_kernels.py --smoke --output reports/performance/kernel_smoke.json

      - name: Cross-framework smoke
        run: |
          python tools/benchmark_compare_pymoo.py \
            --smoke \
            --cases zdt1 \
            --algorithms nsgaii moead \
            --seeds 42 \
            --engine numpy \
            --output reports/performance/pymoo_comparison_smoke.json \
            --markdown reports/performance/pymoo_comparison_smoke.md

      - name: Compare against baseline (scheduled only)
        if: github.event_name == 'schedule'
        run: |
          if [ -f tests/performance/baselines/kernel_smoke_ubuntu_py310.json ]; then
            python tools/benchmark_kernels.py \
              --smoke \
              --output reports/performance/kernel_smoke_compare.json \
              --baseline tests/performance/baselines/kernel_smoke_ubuntu_py310.json
          else
            echo "No committed performance baseline found; skipping regression compare."
          fi

      - name: Seeded cross-framework report (scheduled only)
        if: github.event_name == 'schedule'
        run: |
          python tools/benchmark_compare_pymoo.py \
            --cases zdt1 dtlz2 wfg1 \
            --algorithms nsgaii moead \
            --seeds 42 1337 2024 \
            --engine numba \
            --output reports/performance/pymoo_comparison_nightly.json \
            --markdown reports/performance/pymoo_comparison_nightly.md

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-benchmarks
          path: reports/performance/*

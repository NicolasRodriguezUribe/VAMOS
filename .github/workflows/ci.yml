name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  tests-full:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies (full extras)
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev,compute,research,analysis,examples,studio,autodiff,docs]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Type check (mypy)
        run: mypy src/vamos
      - name: Architecture health checks
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest -q \
            tests/architecture/test_layer_boundaries.py \
            tests/test_monolith_guard.py \
            tests/test_public_api_guard.py \
            tests/architecture/test_public_api_snapshot.py \
            tests/test_import_time_smoke.py \
            tests/architecture/test_no_import_time_side_effects.py \
            tests/architecture/test_dependency_policy.py \
            tests/test_optional_deps_policy.py \
            tests/test_logging_policy.py \
            tests/test_no_prints_in_library.py \
            tests/test_no_deprecation_shims.py \
            tests/test_agents_health_link.py \
            tests/architecture/test_report_retention_policy.py \
            tests/architecture/test_ruff_gate.py \
            tests/architecture/test_ruff_format_gate.py \
            tests/architecture/test_mypy_error_budget.py \
            tests/architecture/test_build_smoke.py \
            tests/architecture/test_py_typed_present.py
      - name: Run tests
        run: pytest -m "not slow" --cov=src/vamos --cov-report=term-missing
      - name: Build docs
        run: mkdocs build --strict

  cpp-native-contract:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies and native backend
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"
          python -m pip install -e "./VAMOS++"
      - name: Verify native backend is active
        run: |
          python - <<'PY'
          import vamospp
          assert vamospp.is_native_backend(), "Native vamospp backend is required in this CI job."
          print("Native backend active:", vamospp.backend_info())
          PY
      - name: Run native contract tests
        env:
          VAMOS_ENABLE_CPP_EVOLVE_FASTPATH: "1"
          VAMOS_ENABLE_CPP_NATIVE_EVOLVE: "1"
        run: |
          python -m pytest -q \
            tests/integration/test_cpp_native_nsga2_ndarray_contract.py \
            tests/integration/test_cpp_native_out_buffer_semantics.py \
            tests/integration/test_cpp_native_vs_fallback_nsga2_smallcase.py \
            tests/integration/test_cpp_native_smsemoa_spea2_ndarray_contract.py \
            tests/integration/test_cpp_native_smsemoa_spea2_vs_fallback_smallcase.py \
            tests/integration/test_cpp_evolve_fastpath.py \
            tests/engine/test_cpp_nsga2_evolve_determinism_extended.py

  tests-minimal:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install minimal package
        run: |
          python -m pip install -U pip
          python -m pip install . pytest
      - name: Run minimal smoke tests
        run: python -m pytest tests/integration/test_minimal_imports.py tests/foundation/test_packaging_data.py

  build-wheel:
    runs-on: ubuntu-latest
    needs: [tests-full, tests-minimal]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel
        run: |
          python -m pip install -U pip build
          python -m build
      - name: Install wheel and smoke test
        run: |
          python -m pip install dist/*.whl
          python - <<'PY'
          import importlib.resources as res
          import vamos
          import vamos.api
          path = res.files("vamos.foundation.data.reference_fronts") / "ZDT1.csv"
          assert path.is_file(), "Reference front missing in wheel"
          print("Wheel smoke OK:", vamos.__version__)
          PY

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

defaults:
  run:
    shell: bash

jobs:
  tests-full:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
            extras: dev,compute,research,analysis,examples,studio,docs
          - os: ubuntu-latest
            python-version: "3.11"
            extras: dev,compute,research,analysis,examples,studio,docs
          - os: ubuntu-latest
            python-version: "3.12"
            extras: dev,compute,research,analysis,examples,studio,docs
          - os: windows-latest
            python-version: "3.12"
            extras: dev,analysis,examples,studio,docs
          - os: macos-latest
            python-version: "3.12"
            extras: dev,analysis,examples,studio,docs
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies (full extras)
        run: |
          python -m pip install -U pip
          python -m pip install -c constraints/ci.txt -e ".[${{ matrix.extras }}]"
      - name: Lint (ruff)
        run: ruff check src/vamos tests
      - name: Type check (mypy)
        run: |
          mypy --config-file pyproject.toml \
            src/vamos/engine/algorithm/config \
            src/vamos/engine/algorithm/registry.py \
            src/vamos/engine/config/spec.py \
            src/vamos/foundation/eval \
            src/vamos/experiment/cli/common.py \
            src/vamos/experiment/optimization_result \
            src/vamos/experiment/unified.py
      - name: Architecture health checks
        run: |
          python -m pip install -c constraints/ci.txt -e ".[dev]"
          python -m pytest -q \
            tests/architecture/test_layer_boundaries.py \
            tests/test_monolith_guard.py \
            tests/test_public_api_guard.py \
            tests/architecture/test_public_api_snapshot.py \
            tests/test_import_time_smoke.py \
            tests/architecture/test_no_import_time_side_effects.py \
            tests/architecture/test_dependency_policy.py \
            tests/test_optional_deps_policy.py \
            tests/test_logging_policy.py \
            tests/test_no_prints_in_library.py \
            tests/test_no_deprecation_shims.py \
            tests/test_agents_health_link.py \
            tests/architecture/test_report_retention_policy.py \
            tests/architecture/test_ruff_gate.py \
            tests/architecture/test_ruff_format_gate.py \
            tests/architecture/test_build_smoke.py \
            tests/architecture/test_py_typed_present.py
      - name: Run tests
        run: pytest -m "not slow" --cov=src/vamos --cov-report=term-missing
      - name: Build docs
        run: mkdocs build --strict
      - name: Notebook Smoke
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        env:
          VAMOS_RUN_NOTEBOOK_TESTS: "1"
        run: pytest -q tests/ux/test_notebooks.py

  tests-minimal:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install minimal package
        run: |
          python -m pip install -U pip
          python -m pip install -c constraints/ci.txt . pytest
      - name: Run minimal smoke tests
        run: python -m pytest tests/integration/test_minimal_imports.py tests/foundation/test_packaging_data.py

  build-wheel:
    runs-on: ubuntu-latest
    needs: [tests-full, tests-minimal]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build wheel
        run: |
          python -m pip install -U pip build
          python -m pip install -c constraints/ci.txt -r constraints/ci.txt
          python -m build
      - name: Install wheel and smoke test
        run: |
          python -m pip install dist/*.whl
          python - <<'PY'
          import importlib.resources as res
          import vamos
          import vamos.api
          path = res.files("vamos.resources.reference_fronts") / "ZDT1.csv"
          assert path.is_file(), "Reference front missing in wheel"
          print("Wheel smoke OK:", vamos.__version__)
          PY

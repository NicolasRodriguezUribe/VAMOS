[build-system]
requires = [
  "scikit-build-core>=0.10",
  "nanobind>=2.0",
]
build-backend = "scikit_build_core.build"

[project]
name = "vamospp"
version = "0.1.0"
description = "C++ acceleration backend for VAMOS"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "VAMOS contributors" }
]
dependencies = [
  "numpy>=1.23",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: C++",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/NicolasRodriguezUribe/VAMOS"
Repository = "https://github.com/NicolasRodriguezUribe/VAMOS"

[tool.scikit-build]
cmake.minimum-version = "3.18"
cmake.build-type = "Release"
wheel.packages = ["src/vamospp"]

[tool.scikit-build.sdist]
include = [
  "CMakeLists.txt",
  "README.md",
  "cpp/**",
  "src/vamospp/**",
]
